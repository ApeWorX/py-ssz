[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz"
dynamic = ["version"]
description = "ssz: Python implementation of the Simple Serialization encoding and decoding"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "eth-utils>=2",
    "lru-dict>=1.1.6",
    "pyrsistent>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/py-ssz"
Repository = "https://github.com/ApeWorX/py-ssz.git"
Issues = "https://github.com/ApeWorX/py-ssz/issues"
Documentation = "https://ssz.readthedocs.io"

[project.optional-dependencies]
yaml = [
    "ruamel.yaml>=0.17.0",
]
[dependency-groups]
test = [
    "hypothesis>=6.22.0,<6.108.7",
    "pytest>=7.0.0",
    "pytest-xdist>=2.4.0",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.18.2",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx_rtd_theme>=1.0.0",
]
yaml = [
    "ruamel.yaml>=0.17.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "yaml" },
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
exclude = [
    "docs",
    "docs.*",
    "newsfragments",
    "newsfragments.*",
    "scripts",
    "scripts.*",
    "tests",
    "tests.*",
]

[tool.setuptools.package-data]
ssz = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.6.0b1"

[tool.mypy]
exclude = [
    "^docs/",
    "^newsfragments/",
    "^scripts/",
    "^tests/",
    "^\\.project-template/",
]
check_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_unused_configs = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "misc",
    "operator",
    "override",
    "return-value",
    "str-bytes-safe",
    "type-arg",
    "union-attr",
    "valid-newtype",
    "valid-type",
    "var-annotated",
]

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    ".project-template",
    "docs/conf.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "D2",
    "D3",
    "D4",
]
ignore = [
    "D200",
    "D203",
    "D204",
    "D205",
    "D212",
    "D400",
    "D401",
    "D412",
    "D415",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["ssz"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true
